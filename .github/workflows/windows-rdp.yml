name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 0


      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force

          New-LocalUser `
            -Name "NvDAdmin" `
            -Password $Password `
            -PasswordNeverExpires `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "NvDAdmin" `
            -ErrorAction SilentlyContinue

          net user runneradmin P@ssw0rd1qazXSW@#


      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |

          # Download Tailscale
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          # Install Tailscale
          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

          # Wait for installation
          Start-Sleep -Seconds 5

          # Connect to Tailscale
          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$Env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          # Wait for connection
          Start-Sleep -Seconds 8

          # Get Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "       >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : NvDAdmin" -ForegroundColor Yellow
          Write-Host "Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "RDP Address  : ${ts_ip}:3389" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""


      - name: 4. Keep Server Alive (48 Hours)
        run: |

          # Wait a little to make sure Tailscale is ready
          Start-Sleep -Seconds 3

          # Get Tailscale IP again
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "          >>> RDP SERVER INFORMATION <<<" -ForegroundColor Cyan
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : NvDAdmin" -ForegroundColor Yellow
          Write-Host "Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "RDP Address  : ${ts_ip}:3389" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host ""

          # Keep server alive
          for ($i = 1; $i -le 2880; $i++) {

            Start-Sleep -Seconds 60

            # Get current Tailscale IP
            $current_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

            Write-Host "[$i/2880] Server running | Tailscale IP: $current_ip" -ForegroundColor Cyan
          }
